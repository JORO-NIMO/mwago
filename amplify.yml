version: 1
frontend:
  phases:
    build:
      commands: []
  artifacts:
    baseDirectory: public
    files:
      - '**/*'
  cache:
    paths: []
customHeaders:
  - pattern: '/downloads/**'
    headers:
      - key: 'Content-Disposition'
        value: 'attachment; filename="mwago.exe"'
      - key: 'Cache-Control'
        value: 'public, max-age=86400'
